<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Portfolio</title>
    <!--
      GitHub Pages serves 404.html when a route is not found.
      This script redirects to index.html while preserving the path
      so React Router can handle it client-side.
      Technique: https://github.com/rafgraph/spa-github-pages
    -->
    <script>
      const repo = "/portfolio-front";
      const path = window.location.pathname.replace(repo, "") || "/";
      const search = window.location.search;
      const hash = window.location.hash;
      const redirect =
        repo +
        "/?p=" +
        encodeURIComponent(path + (search ? "~" + search.slice(1) : "") + hash);
      window.location.replace(redirect);
    </script>
  </head>
  <body></body>
</html>
