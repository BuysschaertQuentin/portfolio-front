<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Redirection…</title>
    <!--
      GitHub Pages returns this 404.html for any unknown path.
      We redirect to index.html with the original path encoded
      in a query param so React Router can handle it client-side.
    -->
    <script>
      (function () {
        // Strip the repo base from the pathname to get the route
        var base = "/portfolio-front";
        var fullPath = window.location.pathname;
        var route = fullPath.startsWith(base)
          ? fullPath.slice(base.length) || "/"
          : fullPath;

        // Encode route + search + hash into a single query param
        var encoded = encodeURIComponent(
          route + window.location.search + window.location.hash,
        );

        // Redirect to index.html at the repo root with the encoded route
        window.location.replace(base + "/?route=" + encoded);
      })();
    </script>
  </head>
  <body></body>
</html>
